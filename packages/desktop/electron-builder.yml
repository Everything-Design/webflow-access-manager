appId: com.everythingflow.webflow-access-manager
productName: Webflow Access Manager
copyright: © 2026 Everythingflow
electronVersion: 38.8.6

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron

extraResources:
  - from: resources/tray-iconTemplate.png
    to: tray-iconTemplate.png
  - from: resources/tray-iconTemplate@2x.png
    to: tray-iconTemplate@2x.png
  - from: resources/tray-icon.png
    to: tray-icon.png

# macOS — unsigned, universal (Intel + Apple Silicon)
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns
  identity: null              # explicitly unsigned
  hardenedRuntime: true
  gatekeeperAssess: false
  type: distribution

# Windows — unsigned NSIS installer + portable exe
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false           # per-user install — no admin required
  artifactName: "${productName} Setup ${version}.${ext}"

portable:
  artifactName: "${productName} ${version} Portable.${ext}"

dmg:
  artifactName: "${productName} ${version} ${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Skip publishing — we'll upload artifacts manually to GitHub Releases or website
publish: null
